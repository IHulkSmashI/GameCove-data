name: Nightly fix audit

# Every device fix GameCove ships (fixes/<id>/fix.json) says what to watch upstream: the kernel file a real fix would
# land in, Bazzite's own udev rules, an issue or pull request, InputPlumber and Handheld Daemon releases,
# linux-firmware, the maker's BIOS listing. Every night GameCove's tools/fixes/audit.py, checked out at the commit
# gamecove-source.env pins, fetches those and compares them with last night's signed snapshot. It records by itself
# only what a fix's rule already declares (a watched Bazzite rule file is there or not; a kernel named in an
# obsolete_when is released), never edits a rule, and treats every fetched page as data.
#
# Published on the rolling "fixes" release, signed with cosign keyless (this workflow's GitHub OIDC identity on main):
#   fixes.json        the fix definitions of the pinned commit plus what the audit recorded; GameCove reads it at most
#                     once a day (app/scripts/device/fix_data.gd) and uses it only when the signature checks out, so a
#                     fix the system no longer needs is retired, or a bad one withdrawn, without an app update
#   audit-state.json  the audit's own snapshot (tomorrow's "before")
#   issues.json       what changed, per fix; GameCove's .github/workflows/fix-audit.yml checks its signature and files
#                     the issues in the GameCove repo, where the fixes live
#
# Two jobs: "build" runs the tests and the audit (third-party pages) with a read-only token and no OIDC; only
# "publish", which runs nothing but a standard-library check of the artifact against the pinned commit's definitions
# (tools/fixes/check_dist.py), pinned cosign and gh, can mint the signing identity and write the release.

on:
  schedule:
    - cron: "9 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fixes
  cancel-in-progress: false

jobs:
  build:
    # the signing identity is this workflow on main: never build data to publish from another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read     # only to read the "nightly" environment's settings (GitHub's "get an environment")
    outputs:
      repo: ${{ steps.src.outputs.repo }}
      commit: ${{ steps.src.outputs.commit }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: data
          sparse-checkout: |
            gamecove-source.env
            tests/check_environment.py
          sparse-checkout-cone-mode: false
      - name: The "nightly" environment exists and only main can deploy to it (GitHub would create it unprotected)
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ask() {
            gh api "$1" >"$2" 2>answer.txt && return 0
            echo "with the token: $(cat answer.txt)"
            curl -fsS -H "Accept: application/vnd.github+json" "https://api.github.com/$1" >"$2" 2>answer.txt && return 0
            echo "without a token: $(cat answer.txt)"
            : >"$2"
          }
          ask "repos/$GH_REPO/environments/nightly" environment.json
          ask "repos/$GH_REPO/environments/nightly/deployment-branch-policies" policies.json
          [ -s environment.json ] || curl -fsS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GH_REPO/environments" |
            python3 -I -c 'import json, sys; print("environments in this repo:", [e["name"] for e in json.load(sys.stdin).get("environments", [])])' || true
          python3 -I tests/check_environment.py environment.json policies.json
      - name: The GameCove commit to build from (gamecove-source.env)
        id: src
        working-directory: data
        run: |
          repo="$(sed -n 's/^GAMECOVE_REPO=//p' gamecove-source.env)"
          commit="$(sed -n 's/^GAMECOVE_COMMIT=//p' gamecove-source.env)"
          printf '%s\n' "$repo" | grep -qxF 'IHulkSmashI/GameCove' || { echo "::error::GAMECOVE_REPO isn't GameCove: $repo"; exit 1; }
          printf '%s\n' "$commit" | grep -qxE '[0-9a-f]{40}' || { echo "::error::GAMECOVE_COMMIT isn't a full commit id: $commit"; exit 1; }
          echo "repo=$repo" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.commit }}
          persist-credentials: false
          path: src
      - name: Exactly the pinned commit
        env:
          COMMIT: ${{ steps.src.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: The pinned commit downloads its fix list from this repo (data_repo.gd)
        env:
          REPO: ${{ github.repository }}
        run: |
          grep -qxF "const REPO := \"$REPO\"" app/scripts/system/data_repo.gd || { echo "::error::the pinned GameCove doesn't read its fix list from $REPO: bump gamecove-source.env"; exit 1; }
          test -f tools/fixes/audit.py || { echo "::error::the pinned GameCove has no fix audit: bump gamecove-source.env"; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r tools/ci/requirements-pytest.txt
      - name: Tests (the definitions, the builder and the audit, from recorded answers)
        working-directory: src/packaging/helpers
        run: python -m pytest -q tests/test_fixes_build.py tests/test_fixes_audit.py
      - name: cosign version (the one get-gamecove.sh pins)
        id: cosign
        run: echo "version=$(sed -n 's/^COSIGN_VERSION=//p' packaging/get-gamecove.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: Last night's snapshot, if its signature checks out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          # the very binary devices download: get-gamecove.sh's pinned sha256
          want="$(sed -n 's/^COSIGN_SHA256=//p' packaging/get-gamecove.sh)"
          echo "$want  $(command -v cosign)" | sha256sum -c -
          mkdir -p prev
          if gh release download fixes -p audit-state.json -p audit-state.json.sigstore.json -D prev 2>/dev/null; then
            if ! cosign verify-blob --bundle prev/audit-state.json.sigstore.json \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "(?i)^https://github\.com/$(printf '%s' "$REPO" | sed 's/[.]/\\./g')/\.github/workflows/fixes\.yml@refs/heads/main$" \
              prev/audit-state.json; then
              echo "::warning::last night's snapshot doesn't verify; tonight is a new baseline (no change is reported)"
              rm -f prev/audit-state.json
            fi
          else
            echo "no snapshot yet: tonight is the baseline"
          fi
      - name: Audit (a source that can't be fetched keeps its last state)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/fixes/audit.py --out dist --previous prev/audit-state.json --max-minutes 15
          cat dist/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fix-audit-data
          path: src/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # runs in the "nightly" environment: only main may deploy to it, no daily approval (README.md)
    environment: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the rolling "fixes" release
      id-token: write   # cosign keyless (GitHub OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.build.outputs.repo }}
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            packaging/get-gamecove.sh
            fixes
            tools/fixes
            tools/traits
            app/data/devices.json
          sparse-checkout-cone-mode: false
      - name: Exactly the commit the build used
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fix-audit-data
          path: dist
      - name: Check the artifact before signing (standard library only)
        # fixes.json must be exactly what the pinned commit's fix.json files build, plus the audit's small notes:
        # nothing fetched can have changed a rule, withdrawn a fix or added one
        run: |
          python3 -I tools/fixes/check_dist.py dist
          python3 -I - dist/audit-state.json dist/issues.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc.get("schema") == 1 and isinstance(doc.get("observed"), dict), "not a schema-1 snapshot"
          iss = json.load(open(sys.argv[2], encoding="utf-8"))
          assert isinstance(iss.get("fixes"), list) and isinstance(iss.get("date"), str), "not an issues file"
          PY
          (cd dist && sha256sum fixes.json >fixes.json.sha256)
      - name: cosign version (the one get-gamecove.sh pins)
        id: cosign
        run: echo "version=$(sed -n 's/^COSIGN_VERSION=//p' packaging/get-gamecove.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: Sign (keyless; the identity GameCove checks)
        env:
          REPO: ${{ github.repository }}
        run: |
          # the very binary devices download: get-gamecove.sh's pinned sha256
          want="$(sed -n 's/^COSIGN_SHA256=//p' packaging/get-gamecove.sh)"
          echo "$want  $(command -v cosign)" | sha256sum -c -
          cosign sign-blob --yes --bundle dist/fixes.json.sigstore.json dist/fixes.json
          cosign sign-blob --yes --bundle dist/audit-state.json.sigstore.json dist/audit-state.json
          cosign sign-blob --yes --bundle dist/issues.json.sigstore.json dist/issues.json
          for f in fixes.json audit-state.json issues.json; do
            cosign verify-blob --bundle "dist/$f.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "(?i)^https://github\.com/$(printf '%s' "$REPO" | sed 's/[.]/\\./g')/\.github/workflows/fixes\.yml@refs/heads/main$" \
              "dist/$f"
          done
      - name: Publish to the rolling "fixes" release (data, never the latest release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view fixes >/dev/null 2>&1 || gh release create fixes --latest=false --title "Fix definitions" --notes "The list of device fixes GameCove knows, rebuilt every night by .github/workflows/fixes.yml from GameCove's fixes/<id>/fix.json (at the commit gamecove-source.env pins) and an audit of each fix's upstream sources. Handhelds read fixes.json at most once a day and use it only when its cosign signature (fixes.json.sigstore.json, this workflow on main) checks out. audit-state.json is the audit's own snapshot; issues.json is what changed, filed as issues in the GameCove repo. Not for direct use: to get GameCove, see https://github.com/IHulkSmashI/GameCove/releases"
          # the signature bundles first, the data last: a device never sees a new file with an old bundle for long
          gh release upload fixes dist/audit-state.json dist/audit-state.json.sigstore.json dist/issues.json dist/issues.json.sigstore.json --clobber
          gh release upload fixes dist/fixes.json.sigstore.json dist/fixes.json.sha256 dist/fixes.json --clobber

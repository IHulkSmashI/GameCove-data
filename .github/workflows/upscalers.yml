name: Nightly upscalers index

# The newest OptiScaler (stable and the v10 nightly), OptiPatcher, fakenvapi, xess-xmx-linux,
# REFramework and FSR 4 files, copied to this repo's rolling "upscalers" release under immutable
# names (<component>-<version>-<sha256[:8]>-<upstream name>), plus every tested pin from GameCove's
# packaging/helpers/gamecove_upscale/data/versions.json under the names it expects. Nothing on
# the mirror is ever deleted or replaced, so every pinned hash keeps resolving. Then
# upscalers.json (per component: version, upstream URL, mirror URL, sha256, size, date) is
# signed with cosign keyless; GameCove's helper (gamecove_upscale/mirror.py) accepts it only from this
# workflow, in this repo, on main (SIGNER_IDENTITY) and checks every file's sha256 either way.
#
# The builder and its tests are GameCove's own (tools/upscalers/build.py, packaging/helpers/tests), checked out at
# the commit gamecove-source.env pins. Run it by hand with
#   gh workflow run upscalers.yml -R IHulkSmashI/GameCove-data
#
# Two jobs: "build" runs the tests and the builder (third-party downloads, archives, 7-Zip) with a read-only token
# and no OIDC, and hands dist/ over as an artifact; only "publish", which runs nothing but pinned cosign, gh and a
# standard-library check of the plan, can mint the signing identity and write the releases. "publish" runs in the
# "nightly" environment, which only main can deploy to (README.md). It re-checks the artifact first
# (tools/upscalers/check_plan.py: standard library and mirror.py only).
#
# Promotion: only official upstream repos (mirror.UPSTREAM), only full releases at least 72 hours old (rolling files
# and git files: unchanged for 72 hours); XMX's scripts must match versions.json.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upscalers
  cancel-in-progress: false

jobs:
  build:
    # the signing identity is this workflow on main: never build an index to publish from another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read     # only to read the "nightly" environment's settings (GitHub's "get an environment")
    outputs:
      repo: ${{ steps.src.outputs.repo }}
      commit: ${{ steps.src.outputs.commit }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: data
          sparse-checkout: |
            gamecove-source.env
            tests/check_environment.py
          sparse-checkout-cone-mode: false
      - name: The "nightly" environment exists and only main can deploy to it (GitHub would create it unprotected)
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # with the job's token first; this repo is public, so without a token too (GitHub may hide environments
          # from a workflow token): only when neither answers is the environment taken as missing
          ask() {
            gh api "$1" >"$2" 2>answer.txt && return 0
            echo "with the token: $(cat answer.txt)"
            curl -fsS -H "Accept: application/vnd.github+json" "https://api.github.com/$1" >"$2" 2>answer.txt && return 0
            echo "without a token: $(cat answer.txt)"
            : >"$2"
          }
          ask "repos/$GH_REPO/environments/nightly" environment.json
          ask "repos/$GH_REPO/environments/nightly/deployment-branch-policies" policies.json
          [ -s environment.json ] || curl -fsS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GH_REPO/environments" |
            python3 -I -c 'import json, sys; print("environments in this repo:", [e["name"] for e in json.load(sys.stdin).get("environments", [])])' || true
          python3 -I tests/check_environment.py environment.json policies.json
      - name: The GameCove commit to build from (gamecove-source.env)
        id: src
        working-directory: data
        run: |
          repo="$(sed -n 's/^GAMECOVE_REPO=//p' gamecove-source.env)"
          commit="$(sed -n 's/^GAMECOVE_COMMIT=//p' gamecove-source.env)"
          printf '%s\n' "$repo" | grep -qxF 'IHulkSmashI/GameCove' || { echo "::error::GAMECOVE_REPO isn't GameCove: $repo"; exit 1; }
          printf '%s\n' "$commit" | grep -qxE '[0-9a-f]{40}' || { echo "::error::GAMECOVE_COMMIT isn't a full commit id: $commit"; exit 1; }
          echo "repo=$repo" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.commit }}
          persist-credentials: false
          path: src
      - name: Exactly the pinned commit
        env:
          COMMIT: ${{ steps.src.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: The pinned GameCove mirrors to this repo (its mirror.py names it)
        env:
          REPO: ${{ github.repository }}
        run: |
          grep -qxF "REPO = \"$REPO\"" packaging/helpers/gamecove_upscale/mirror.py || {
            echo "::error::the pinned GameCove commit mirrors upscalers somewhere else (mirror.py REPO); bump gamecove-source.env to a GameCove main commit that names $REPO"
            exit 1
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tools (7-Zip for OptiScaler's and fakenvapi's archives)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q p7zip-full
          pip install --require-hashes --no-deps -r tools/ci/requirements-pytest.txt
      - name: Tests (the builder and the helper that reads its index)
        run: python -m pytest -q packaging/helpers/tests
      - name: cosign version (the one get-gamecove.sh pins)
        id: cosign
        run: echo "version=$(sed -n 's/^COSIGN_VERSION=//p' packaging/get-gamecove.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: What the mirror has, and last night's index if its signature checks out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          # the very binary devices download: get-gamecove.sh's pinned sha256
          want="$(sed -n 's/^COSIGN_SHA256=//p' packaging/get-gamecove.sh)"
          echo "$want  $(command -v cosign)" | sha256sum -c -
          mkdir -p prev
          : >prev/assets.tsv
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName | select(test("^upscalers(-[0-9]+)?$"))'); do
            id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id)"
            gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" \
              --jq ".[] | [\"$tag\", .name, (.size | tostring)] | @tsv" >>prev/assets.tsv
          done
          echo "files on the mirror: $(wc -l <prev/assets.tsv)"
          if gh release download upscalers -p upscalers.json -p upscalers.json.sigstore.json -D prev 2>/dev/null; then
            ident="(?i)^https://github\.com/$(printf '%s' "$REPO" | sed 's/[.]/\\./g')/\.github/workflows/upscalers\.yml@refs/heads/main$"
            if ! cosign verify-blob --bundle prev/upscalers.json.sigstore.json \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "$ident" prev/upscalers.json; then
              echo "::warning::last night's upscalers.json doesn't verify; its entries are not carried over"
              rm -f prev/upscalers.json
            fi
          fi
      - name: Build (newest upstream builds and the tested pins; a failing upstream keeps its previous entry)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/upscalers/build.py --versions packaging/helpers/gamecove_upscale/data/versions.json \
            --out dist --have prev/assets.tsv --previous prev/upscalers.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upscalers-dist
          path: src/dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    # runs in the "nightly" environment: only main may deploy to it, no daily approval (README.md)
    environment: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the rolling "upscalers" release(s)
      id-token: write   # cosign keyless (GitHub OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.build.outputs.repo }}
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            packaging/get-gamecove.sh
            packaging/helpers/gamecove_upscale/__init__.py
            packaging/helpers/gamecove_upscale/mirror.py
            packaging/helpers/gamecove_upscale/tls.py
            packaging/helpers/gamecove_upscale/data/versions.json
            tools/upscalers/check_plan.py
          sparse-checkout-cone-mode: false
      - name: Exactly the commit the build used
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upscalers-dist
          path: dist
      - name: Check the artifact before signing (standard library and GameCove's own mirror.py only)
        # the index parses as devices require (every upstream URL is its component's official repository), and
        # every planned file is re-hashed against the hash in its name and the one the index or versions.json names
        run: python3 -I tools/upscalers/check_plan.py dist packaging/helpers/gamecove_upscale/data/versions.json
      - name: cosign version (the one get-gamecove.sh pins)
        id: cosign
        run: echo "version=$(sed -n 's/^COSIGN_VERSION=//p' packaging/get-gamecove.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: Sign the index (keyless; the identity GameCove checks)
        env:
          REPO: ${{ github.repository }}
        run: |
          # the very binary devices download: get-gamecove.sh's pinned sha256
          want="$(sed -n 's/^COSIGN_SHA256=//p' packaging/get-gamecove.sh)"
          echo "$want  $(command -v cosign)" | sha256sum -c -
          cosign sign-blob --yes --bundle dist/upscalers.json.sigstore.json dist/upscalers.json
          ident="(?i)^https://github\.com/$(printf '%s' "$REPO" | sed 's/[.]/\\./g')/\.github/workflows/upscalers\.yml@refs/heads/main$"
          cosign verify-blob --bundle dist/upscalers.json.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$ident" dist/upscalers.json
          (cd dist && sha256sum upscalers.json >upscalers.json.sha256)
      - name: Publish (new files first, never replaced; the signed index last)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ensure() {
            gh release view "$1" >/dev/null 2>&1 || gh release create "$1" --latest=false \
              --title "Upscaler files ($1)" \
              --notes "Copies of the upscaler files GameCove installs (OptiScaler, OptiPatcher, fakenvapi, xess-xmx-linux, REFramework, FSR 4), each under a name with its version and sha256, so a file moved or replaced upstream never breaks an install. Nothing here is ever deleted. Each file keeps its own licence: see README.md and upscalers.json (upstream URL, release and source links). Every OptiScaler build (GPL-3.0) has the source archive of the exact commit it was built from next to it. AMD's FidelityFX DLL is redistributed under AMD's binary licence, whose notice is next to it. upscalers.json is signed by .github/workflows/upscalers.yml in IHulkSmashI/GameCove-data (cosign keyless)."
          }
          ensure upscalers
          tab="$(printf '\t')"
          while IFS="$tab" read -r tag name path; do
            [ -n "$tag" ] || continue
            ensure "$tag"
            echo "uploading $tag/$name"
            gh release upload "$tag" "dist/$path"
          done <dist/upload-plan.tsv
          gh release upload upscalers dist/upscalers.json dist/upscalers.json.sigstore.json dist/upscalers.json.sha256 --clobber
